name: Validate skill library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node scripts/check-assets.mjs
      - run: node --test scripts/check-assets.test.mjs scripts/check-runtime.test.mjs
